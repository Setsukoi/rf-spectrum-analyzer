[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "rfsa"
version = "0.2.0"
description = "Automated RF spectrum measurements on a Keysight MXA N9020A"
requires-python = ">=3.11"
dependencies = [
    "pyvisa>=1.13",
    "numpy>=1.24",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rfsa-web = "rfsa.web.app:main"

[tool.setuptools.package-data]
"rfsa.web" = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "hardware: needs a real analyzer; only runs with --visa=<resource>",
]

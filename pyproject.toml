[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "rfsa"
version = "0.2.0"
description = "Automated RF spectrum measurements on a Keysight MXA N9020A"
requires-python = ">=3.11"
dependencies = ["pyvisa>=1.13", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "hardware: needs a real analyzer; only runs with --visa=<resource>",
]
